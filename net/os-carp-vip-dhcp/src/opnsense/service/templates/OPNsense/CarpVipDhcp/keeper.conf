{#
    Rendered keeper table for lease_keeper.py (one line per enabled keeper).

    Format per line: pipe-separated KEY=VALUE fields, in no fixed order. A field
    may be added or removed without shifting the others, and an empty value means
    "not set". Recognised keys:
      request  iface  chaddr  demote  vhid  follow  cidmode (or, for a keeper
      not migrated to model 1.4.0, vendorclass  clientid)
      hostname  arpnudge  arplistenpromisc  defaultroutemode  backupegress
      backupegressform  backupegressgateway  backupegressinterface  backupegressprefixes
      vlanpcp  sendopts  reqopts  vipbits  wangw
    The readers (lease_keeper.py, rc.d, the CARP status hook, status.py) dispatch
    by key name, so an unknown key is ignored and a missing key falls back to its
    default. Values
    never contain a pipe or a line break (the model masks forbid it), so each
    record stays a single parseable line.

    Everything is derived from each keeper's referenced CARP VirtualIP: we look
    the VIP up in the legacy virtualip list to get its interface (-> physical
    device) and VHID (-> chaddr 00:00:5e:00:01:VHID). chaddrOverride wins when set.
    vipbits is the VIP's configured prefix length and wangw the address of the one
    enabled IPv4 gateway on the VIP's interface (empty when there is none or more
    than one, or when another keeper's VIP shares the interface), so a following
    keeper can tell when the lease's mask or router no longer match.
    Disabled or unresolvable keepers are skipped, so an empty file means "nothing
    to run". rc.d starts one supervised daemon per line (keyed by the request IP).
#}
{% for k in helpers.toList('OPNsense.CarpVipDhcp.keepers.keeper') %}
{%   if k.enabled == '1' and k.carpVip %}
{%     set vip = namespace(iface='', vhid='', bits='', ifname='') %}
{%     for v in helpers.toList('virtualip.vip') %}
{%       if v.mode == 'carp' and v.subnet == k.carpVip %}
{%         set vip.iface = helpers.physical_interface(v.interface) %}
{%         set vip.vhid = v.vhid %}
{%         set vip.bits = v.subnet_bits|default('') %}
{%         set vip.ifname = v.interface %}
{%       endif %}
{%     endfor %}
{%     set gw = namespace(addr='', count=0) %}
{#     The gateways live in the Gateways model since OPNsense 24.1; only a configuration
       without it uses the legacy list (a leftover legacy copy must not count twice). #}
{%     set gw_items = helpers.toList('OPNsense.Gateways.gateway_item') or helpers.toList('gateways.gateway_item') %}
{%     for g in gw_items %}
{%       if vip.ifname and g.interface == vip.ifname and g.ipprotocol|default('inet') == 'inet' and g.gateway|default('') and g.disabled|default('0') != '1' %}
{%         set gw.count = gw.count + 1 %}
{%         set gw.addr = g.gateway %}
{%       endif %}
{%     endfor %}
{#     Only for the one keeper on that interface: two keepers whose leases carry
       different routers would otherwise move the shared gateway back and forth. #}
{%     set peers = namespace(count=0) %}
{%     for k2 in helpers.toList('OPNsense.CarpVipDhcp.keepers.keeper') %}
{%       if k2.enabled == '1' and k2.carpVip %}
{%         for v2 in helpers.toList('virtualip.vip') %}
{%           if v2.mode == 'carp' and v2.subnet == k2.carpVip and v2.interface == vip.ifname %}
{%             set peers.count = peers.count + 1 %}
{%           endif %}
{%         endfor %}
{%       endif %}
{%     endfor %}
{%     set wangw = gw.addr if gw.count == 1 and peers.count == 1 else '' %}
{%     set override = k.chaddrOverride|default('') %}
{%     if override %}
{%       set chaddr = override %}
{%     elif vip.vhid %}
{%       set chaddr = '00:00:5e:00:01:%02x'|format(vip.vhid|int) %}
{%     else %}
{%       set chaddr = '' %}
{%     endif %}
{%     if vip.iface and chaddr %}
{%       set beiface = '' %}
{%       if k.backupEgressInterface|default('') %}
{%         set beiface = helpers.physical_interface(k.backupEgressInterface) %}
{%       endif %}
{#       A keeper not migrated to model 1.4.0 (its migration save was refused,
         or HA sync from a node on an older version) keeps the fields it was
         saved with: render those exactly as the 1.3.0 template did, never the
         new defaults, so it sends the same DHCP identity. #}
{%       if k.leasePolicy|default('') %}
{%         set follow = '1' if k.leasePolicy == 'follow' else '0' %}
{%         set demote = '1' if k.leasePolicy == 'failover' else '0' %}
{%       else %}
{%         set follow = k.followIp|default('0') %}
{%         set demote = k.demoteOnLeaseLoss|default('0') %}
{%       endif %}
request={{ k.carpVip }}|iface={{ vip.iface }}|chaddr={{ chaddr }}|demote={{ demote }}|vhid={{ vip.vhid }}|follow={{ follow }}|{% if k.clientIdentifier|default('') %}cidmode={{ k.clientIdentifier }}{% else %}vendorclass={{ k.vendorClass|default('') }}|clientid={{ k.clientId|default('') }}{% endif %}|hostname={{ k.hostname|default('') }}|arpnudge={{ k.arpNudgeInterval|default('0') }}|arplistenpromisc={{ k.arpListenPromisc|default('0') }}|defaultroutemode={{ k.defaultRouteMode|default('off') }}|backupegress={{ k.backupEgress|default('0') }}|backupegressform={{ k.backupEgressForm|default('split') }}|backupegressgateway={{ k.backupEgressGateway|default('') }}|backupegressinterface={{ beiface }}|backupegressprefixes={{ k.backupEgressPrefixes|default('') }}|vlanpcp={{ k.vlanPriority|default('') }}|sendopts={{ k.sendOptionsEncoded|default('') }}|reqopts={{ k.requestOptionsEncoded|default('') }}|vipbits={{ vip.bits }}|wangw={{ wangw }}
{%     endif %}
{%   endif %}
{% endfor %}
